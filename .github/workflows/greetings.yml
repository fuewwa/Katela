name: Greetings
on: [issues, pull_request_target]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: 'Welcome to the Katela repository! Thank you for opening your first issue.'
          pr-message: 'Welcome to the Katela repository! Please check README.md and CONTRIBUTING.md, if you didnt read this arleady. Thank you for your first pull request.'

